version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: whispr-db
    environment:
      POSTGRES_USER: whispr
      POSTGRES_PASSWORD: password
      POSTGRES_DB: whispr_dev
    ports:
      - "15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: whispr-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:

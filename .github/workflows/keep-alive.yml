name: Keep Backend Alive

on:
  schedule:
    # Exécute ce script toutes les 14 minutes pour empêcher Render de s'endormir
    - cron: '*/14 * * * *'
  workflow_dispatch: # Permet de le lancer manuellement depuis l'interface GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Health Endpoint
        run: curl -s "https://whispr-backend.onrender.com/api/health" | grep "UP" || echo "Backend ping failed, but that's okay if it's still waking up."

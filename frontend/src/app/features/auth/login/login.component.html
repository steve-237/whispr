<div class="container animate-fade-in" style="max-width: 400px; margin: 4rem auto;">
  <div class="glass-panel" style="padding: 2.5rem;">
    <h2 style="text-align: center; margin-bottom: 2rem;">Connexion</h2>
    
    <div *ngIf="error()" style="color: #ef4444; padding: 1rem; background: rgba(239, 68, 68, 0.1); border-radius: var(--radius-md); margin-bottom: 1.5rem; text-align: center;">
      {{ error() }}
    </div>

    <form (ngSubmit)="onSubmit()">
      <div style="margin-bottom: 1.5rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: var(--color-text-muted);">Email</label>
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email"
          required
          style="width: 100%; padding: 0.875rem; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--color-border); color: white; outline: none; transition: border-color 0.3s;"
          placeholder="nom@exemple.com">
      </div>

      <div style="margin-bottom: 2rem;">
        <label style="display: block; margin-bottom: 0.5rem; color: var(--color-text-muted);">Mot de passe</label>
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password"
          required
          style="width: 100%; padding: 0.875rem; border-radius: var(--radius-md); background: rgba(255, 255, 255, 0.05); border: 1px solid var(--color-border); color: white; outline: none; transition: border-color 0.3s;"
          placeholder="••••••••">
      </div>

      <button 
        type="submit" 
        class="btn btn-primary" 
        style="width: 100%; font-size: 1.1rem; margin-bottom: 1.5rem;"
        [disabled]="isLoading() || !email || !password">
        {{ isLoading() ? 'Connexion...' : 'Se connecter' }}
      </button>

      <p style="text-align: center; color: var(--color-text-muted); font-size: 0.9rem;">
        Pas encore de compte ? <a routerLink="/register" style="font-weight: 600;">S'inscrire</a>
      </p>
    </form>
  </div>
</div>

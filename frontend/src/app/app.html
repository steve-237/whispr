@if (!isBackendReady()) {
  @if (isWakingUp()) {
    <div class="wakeup-overlay">
      <div class="wakeup-content">
        <div class="spinner"></div>
        <h2>{{ wakeUpText() }}</h2>
        <p>{{ wakeUpMsg1() }}</p>
        <p class="small-text">{{ wakeUpMsg2() }}</p>
      </div>
    </div>
  }
} @else {
  <router-outlet></router-outlet>
}
<app-toast></app-toast>

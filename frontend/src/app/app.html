@if (!isBackendReady()) {
  @if (isWakingUp()) {
    <div class="wakeup-overlay">
      <div class="wakeup-content">
        <div class="spinner"></div>
        <h2>{{ 'APP.WAKE_UP' | translate }}</h2>
        <p>{{ 'APP.WAKE_UP_MSG1' | translate }}</p>
        <p class="small-text">{{ 'APP.WAKE_UP_MSG2' | translate }}</p>
      </div>
    </div>
  }
} @else {
  <router-outlet></router-outlet>
}

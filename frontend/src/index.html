<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Whispr - Messages Anonymes</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤫</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&amp;family=Outfit:wght@400;500;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <script>
      window.addEventListener('error', function (e) {
        document.body.innerHTML +=
          '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0;">' +
          e.message +
          '</div>';
      });
      window.addEventListener('unhandledrejection', function (e) {
        document.body.innerHTML +=
          '<div style="color:red; background:white; padding:20px; z-index:9999; position:absolute; top:0;">' +
          e.reason +
          '</div>';
      });
    </script>
    <link rel="manifest" href="manifest.webmanifest" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <app-root></app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>

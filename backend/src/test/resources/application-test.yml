server:
  port: 0

spring:
  application:
    name: backend-test
  
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
    show-sql: false
    open-in-view: false

  flyway:
    enabled: false

jwt:
  secret: "thisIsAVerySecretKeyForWhisprAppThatMustBeAtLeast32BytesLong"

cors:
  allowed-origins: "http://localhost:4200"

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USER:}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 15000
      validation-timeout: 5000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
    show-sql: false

jwt:
  secret: "${JWT_SECRET:thisIsAVerySecretKeyForWhisprAppThatMustBeAtLeast32BytesLong}"

cors:
  allowed-origins: "${CORS_ALLOWED_ORIGINS:${FRONTEND_URL:https://whispr-theta-smoky.vercel.app}}"

whispr:
  keep-alive:
    enabled: true
    url: ${KEEP_ALIVE_URL:https://whispr-z6zx.onrender.com/api/health}
